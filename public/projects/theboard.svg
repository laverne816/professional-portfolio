<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="board-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110E18" />
      <stop offset="50%" stop-color="#161220" />
      <stop offset="100%" stop-color="#0D0B12" />
    </linearGradient>
    <linearGradient id="primary-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D99AB8" />
      <stop offset="100%" stop-color="#E8B4CC" />
    </linearGradient>
    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
