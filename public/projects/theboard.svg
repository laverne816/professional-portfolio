  <circle cx="950" cy="550" r="320" fill="#6D5A8E" opacity="0.07" filter="blur(70px)" />

  <!-- TOP NAV BAR -->
  <g transform="translate(80, 28)">
    <!-- Brand Logo -->
    <rect x="0" y="4" width="28" height="28" rx="6" fill="#221A30" stroke="#D99AB8" stroke-width="1.5" />
    <path d="M8 12 L14 18 L20 12" fill="none" stroke="#D99AB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1.5px">THE BOARD</text>
    <text x="160" y="24" font-family="'Outfit', system-ui, sans-serif" font-size="12" font-weight="600" fill="#D99AB8" letter-spacing="2px">· SA YOUTH PORTAL</text>

