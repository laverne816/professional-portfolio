      <text x="24" y="158" font-family="'Outfit', sans-serif" font-size="13" fill="#8E839E">&amp; living allowance for Computer Science</text>
      <text x="24" y="176" font-family="'Outfit', sans-serif" font-size="13" fill="#8E839E">and Information Systems students in 2026.</text>

