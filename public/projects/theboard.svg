      <g transform="translate(24, 206)" font-family="'Outfit', sans-serif" font-size="11" fill="#C5BCDC">
        <rect width="94" height="24" rx="6" fill="#221A30" />
        <text x="47" y="16" text-anchor="middle">100% Tuition</text>

        <rect x="102" y="0" width="74" height="24" rx="6" fill="#221A30" />
        <text x="139" y="16" text-anchor="middle">Allowance</text>

        <rect x="184" y="0" width="78" height="24" rx="6" fill="#221A30" />
        <text x="223" y="16" text-anchor="middle">All Univs</text>
