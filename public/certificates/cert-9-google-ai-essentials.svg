<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=Caveat:wght@600;700&amp;display=swap');
      .serif-name { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: 700; fill: #1E2229; letter-spacing: -0.5px; }
      .spec-title { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 40px; font-weight: 800; fill: #111827; letter-spacing: -0.5px; }
      .sans-bold { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 700; }
      .sans-med { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 500; }
      .sans-reg { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background White -->
  <rect width="1200" height="850" fill="#FFFFFF" />

  <!-- Outer Double Hairline Frame matching screenshot -->
  <rect x="16" y="16" width="1168" height="818" fill="none" stroke="#C8C8C8" stroke-width="1.5" />
  <rect x="22" y="22" width="1156" height="806" fill="none" stroke="#E2E2E2" stroke-width="0.75" />
  <!-- Corner notch squares -->
  <rect x="12" y="12" width="8" height="8" fill="#B0B0B0" />
  <rect x="1180" y="12" width="8" height="8" fill="#B0B0B0" />
  <rect x="12" y="830" width="8" height="8" fill="#B0B0B0" />
  <rect x="1180" y="830" width="8" height="8" fill="#B0B0B0" />

  <!-- ================= LEFT SPECIALIZATION SIDEBAR ================= -->
  <rect x="23" y="23" width="228" height="804" fill="#E2E8F0" />
  <line x1="251" y1="23" x2="251" y2="827" stroke="#CBD5E1" stroke-width="1" />

  <!-- Dark Slate Ribbon Banner Graphic -->
  <g transform="translate(58, 0)">
    <!-- Ribbon tails -->
    <polygon points="12,180 50,180 50,285 31,268 12,285" fill="#202E3D" />
    <polygon points="108,180 146,180 146,285 127,268 108,285" fill="#202E3D" />

    <!-- Ribbon Navy Base -->
    <rect x="0" y="0" width="158" height="235" fill="#2E4053" />

    <!-- Circular Badge -->
    <g transform="translate(79, 100)">
      <circle cx="0" cy="0" r="68" fill="#FFFFFF" stroke="#2E4053" stroke-width="2.5" />
      <circle cx="0" cy="0" r="63" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="2,2" />
      <circle cx="0" cy="0" r="58" fill="none" stroke="#2E4053" stroke-width="1.5" />

      <!-- Top curved text: LEARNING WITHOUT LIMITS -->
      <path id="spec-curve-top" d="M -48 -10 A 48 48 0 0 1 48 -10" fill="none" />
      <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#2E4053" letter-spacing="1">
        <textPath href="#spec-curve-top" startOffset="50%" text-anchor="middle">
          LEARNING WITHOUT LIMITS
        </textPath>
      </text>

      <!-- Center wordmark: coursera -->
      <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="800" fill="#1E293B" letter-spacing="-0.5">coursera</text>

      <!-- Bottom curved text: SPECIALIZATION CERTIFICATE -->
      <path id="spec-curve-bot" d="M -48 14 A 48 48 0 0 0 48 14" fill="none" />
      <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="700" fill="#2E4053" letter-spacing="1.2">
        <textPath href="#spec-curve-bot" startOffset="50%" text-anchor="middle">
          SPECIALIZATION CERTIFICATE
        </textPath>
      </text>
    </g>

    <!-- Dark horizontal banner: "5 Courses" -->
    <rect x="0" y="200" width="158" height="35" fill="#1C2833" />
    <text x="79" y="223" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">5 Courses</text>
  </g>

  <!-- 5 Courses List -->
  <g transform="translate(48, 395)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="sans-bold" font-size="11" fill="#0F172A">Introduction to AI</text>
    </g>
    <g transform="translate(0, 36)">
      <text x="0" y="0" class="sans-bold" font-size="11" fill="#0F172A">Maximize Productivity With</text>
      <text x="0" y="15" class="sans-bold" font-size="11" fill="#0F172A">AI Tools</text>
    </g>
    <g transform="translate(0, 84)">
      <text x="0" y="0" class="sans-bold" font-size="11" fill="#0F172A">Discover the Art of</text>
      <text x="0" y="15" class="sans-bold" font-size="11" fill="#0F172A">Prompting</text>
    </g>
    <g transform="translate(0, 132)">
      <text x="0" y="0" class="sans-bold" font-size="11" fill="#0F172A">Use AI Responsibly</text>
    </g>
    <g transform="translate(0, 166)">
      <text x="0" y="0" class="sans-bold" font-size="11" fill="#0F172A">Stay Ahead of the AI Curve</text>
    </g>
  </g>

  <!-- ================= MAIN CERTIFICATE AREA ================= -->
  <!-- Google "G" Box Tile -->
  <g transform="translate(295, 65)">
    <rect width="140" height="140" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Google G Logo -->
    <g transform="translate(26, 26) scale(1.83)">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.79l7.97-6.2z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </g>
  </g>

  <!-- Top Right Signature: Amanda Brophy -->
  <g transform="translate(860, 240)">
    <text x="0" y="0" font-family="'Caveat', cursive, serif" font-size="34" font-weight="700" fill="#111827">Amanda Brophy</text>
    <text x="0" y="32" class="sans-reg" font-size="12.5" fill="#374151">Amanda Brophy</text>
    <text x="0" y="50" class="sans-reg" font-size="12.5" fill="#374151">Global Director of</text>
    <text x="0" y="68" class="sans-reg" font-size="12.5" fill="#374151">Google Career</text>
    <text x="0" y="86" class="sans-reg" font-size="12.5" fill="#374151">Certificates</text>
  </g>

  <!-- Date -->
  <g transform="translate(295, 260)">
    <text x="0" y="0" class="sans-med" font-size="14" fill="#4B5563">May 8, 2026</text>
  </g>

  <!-- Learner Name -->
  <g transform="translate(295, 315)">
    <text x="0" y="0" class="serif-name" font-size="42">Laverne Rollison</text>
  </g>

  <!-- "has successfully completed the online Specialization" -->
  <g transform="translate(295, 360)">
    <text x="0" y="0" class="sans-reg" font-size="14" fill="#4B5563">has successfully completed the online Specialization</text>
  </g>

  <!-- Title: Google AI Essentials -->
  <g transform="translate(295, 420)">
    <text x="0" y="0" class="spec-title">Google AI Essentials</text>
  </g>

  <!-- Summary Paragraph -->
  <g transform="translate(295, 475)">
    <text x="0" y="0" class="sans-reg" font-size="14" fill="#4B5563">Those who earn the Google AI Essentials Certificate have completed</text>
    <text x="0" y="24" class="sans-reg" font-size="14" fill="#4B5563">five courses, developed by Google, featuring hands-on practice</text>
    <text x="0" y="48" class="sans-reg" font-size="14" fill="#4B5563">designed to build AI skills. They are competent in using AI tools</text>
    <text x="0" y="72" class="sans-reg" font-size="14" fill="#4B5563">responsibly and improving productivity across their workflow.</text>
  </g>

  <!-- Bottom Right Verification -->
  <g transform="translate(860, 755)">
    <text x="0" y="0" class="sans-reg" font-size="11.5" fill="#4B5563">Verify this certificate at:</text>
    <text x="0" y="18" class="sans-bold" font-size="11.5" fill="#0056D2" text-decoration="underline">https://coursera.org/verify/specialization/ZC3D3GJDY253</text>
  </g>

  <!-- Bottom Left Legal text -->
  <g transform="translate(295, 765)">
    <text x="0" y="0" class="sans-reg" font-size="8" fill="#6B7280">This certificate attests to the learner's completion of an online program delivered via Coursera. It does not constitute formal</text>
    <text x="0" y="13" class="sans-reg" font-size="8" fill="#6B7280">enrollment at any university or entity and does not itself grant academic credit, grades, or a degree. Institutions or</text>
    <text x="0" y="26" class="sans-reg" font-size="8" fill="#6B7280">organizations may, at their discretion, recognize this learning toward their own programs or credentials.</text>
  </g>
</svg>