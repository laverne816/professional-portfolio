<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=Caveat:wght@600;700&amp;display=swap');
      .serif-name { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: 700; fill: #1E2229; letter-spacing: -0.5px; }
      .serif-title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 700; fill: #1E2229; line-height: 1.25; }
      .sans-bold { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 700; }
      .sans-med { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 500; }
      .sans-reg { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background White Paper -->
  <rect width="1200" height="850" fill="#FFFFFF" />

  <!-- Outer Double Hairline Frame matching screenshot -->
  <rect x="16" y="16" width="1168" height="818" fill="none" stroke="#C8C8C8" stroke-width="1.5" />
  <rect x="22" y="22" width="1156" height="806" fill="none" stroke="#E2E2E2" stroke-width="0.75" />
  <!-- Corner notch squares -->
  <rect x="12" y="12" width="8" height="8" fill="#B0B0B0" />
  <rect x="1180" y="12" width="8" height="8" fill="#B0B0B0" />
  <rect x="12" y="830" width="8" height="8" fill="#B0B0B0" />
  <rect x="1180" y="830" width="8" height="8" fill="#B0B0B0" />

  <!-- Right-Hand Side Light Panel (matching Coursera layout) -->
  <rect x="760" y="23" width="417" height="700" fill="#F8F8F8" />
  <line x1="760" y1="23" x2="760" y2="723" stroke="#ECECEC" stroke-width="1" />

  <!-- ================= RIGHT COLUMN CONTENT ================= -->
  <!-- "COURSE CERTIFICATE" Header -->
  <g transform="translate(970, 115)">
    <text x="0" y="0" text-anchor="middle" class="sans-bold" font-size="21" fill="#222222" letter-spacing="3.5">COURSE</text>
    <text x="0" y="28" text-anchor="middle" class="sans-bold" font-size="21" fill="#222222" letter-spacing="3.5">CERTIFICATE</text>
  </g>

  <!-- Iconic Circular Coursera Seal (Center-Right) -->
  <g transform="translate(970, 390)">
    <!-- Seal Outer Rings -->
    <circle cx="0" cy="0" r="105" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" />
    <circle cx="0" cy="0" r="99" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="2,3" />
    <circle cx="0" cy="0" r="93" fill="none" stroke="#333333" stroke-width="1.5" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="1.5,2.5" />

    <!-- Circular Curved Text Top: "EDUCATION FOR EVERYONE" -->
    <path id="curve-top" d="M -75 -15 A 75 75 0 0 1 75 -15" fill="none" />
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#333333" letter-spacing="2">
      <textPath href="#curve-top" startOffset="50%" text-anchor="middle">
        EDUCATION FOR EVERYONE
      </textPath>
    </text>

    <!-- Center Wordmark: "coursera" -->
    <text x="0" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="27" font-weight="800" fill="#222222" letter-spacing="-0.5">coursera</text>

    <!-- Circular Curved Text Bottom: "COURSE CERTIFICATE" -->
    <path id="curve-bot" d="M -75 22 A 75 75 0 0 0 75 22" fill="none" />
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#333333" letter-spacing="2.5">
      <textPath href="#curve-bot" startOffset="50%" text-anchor="middle">
        COURSE CERTIFICATE
      </textPath>
    </text>
  </g>

  <!-- Right Bottom Verification Info -->
  <g transform="translate(1120, 640)">
    <text x="0" y="0" text-anchor="end" class="sans-reg" font-size="11" fill="#444444">Verify at:</text>
    <text x="0" y="18" text-anchor="end" class="sans-bold" font-size="11.5" fill="#0056D2" text-decoration="underline">https://coursera.org/verify/RGU5FPTN4MWK</text>
    <text x="0" y="38" text-anchor="end" class="sans-reg" font-size="9" fill="#555555">Coursera has confirmed the identity of this individual and their</text>
    <text x="0" y="52" text-anchor="end" class="sans-reg" font-size="9" fill="#555555">participation in the course.</text>
  </g>

  <!-- ================= LEFT COLUMN CONTENT ================= -->
  <!-- 1. Partner / Institution Logos -->
  <g transform="translate(100, 95)">
    
        <!-- DeepLearning.AI logo -->
        <g transform="translate(0, 0)">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#FF4060" stroke-width="2.5" />
          <circle cx="12" cy="12" r="5" fill="#FF4060" />
          <text x="28" y="17" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#FF4060">DeepLearning.AI</text>
        </g>
        <!-- Stanford Online logo -->
        <g transform="translate(0, 32)">
          <text x="0" y="20" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#8C1515">Stanford</text>
          <rect x="94" y="5" width="68" height="18" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" />
          <text x="98" y="19" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#111111" letter-spacing="1.5">ONLINE</text>
        </g>
      
  </g>

  <!-- 2. Date -->
  <g transform="translate(100, 240)">
    <text x="0" y="0" class="sans-med" font-size="13" fill="#444444">Aug 27, 2026</text>
  </g>

  <!-- 3. Student Name -->
  <g transform="translate(100, 290)">
    <text x="0" y="0" class="serif-name">Laverne Rollison</text>
  </g>

  <!-- 4. "has successfully completed" -->
  <g transform="translate(100, 335)">
    <text x="0" y="0" class="sans-reg" font-size="13" fill="#444444">has successfully completed</text>
  </g>

  <!-- 5. Course Title -->
  <g transform="translate(100, 385)">
    <text x="0" y="0" class="serif-title">Unsupervised Learning, Recommenders,</text>
    <text x="0" y="34" class="serif-title">Reinforcement Learning</text>
  </g>

  <!-- 6. Course Authorization / Offering statement -->
  <g transform="translate(100, 468)">
    <text x="0" y="0" class="sans-reg" font-size="12" fill="#444444">an online course authorized by DeepLearning.AI and Stanford Online and offered through</text>
    <text x="0" y="20" class="sans-reg" font-size="12" fill="#444444">Coursera</text>
  </g>

  <!-- 7. Signatures & Instructor Credentials -->
  <g transform="translate(100, 600)">
    <!-- Signature drawing -->
    <g transform="translate(0, 0)">
      
        <path d="M 0 32 Q 15 8 28 25 T 52 14 T 75 30 T 95 12" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" />
        <path d="M 60 12 L 68 38 L 74 15" fill="none" stroke="#222222" stroke-width="1.6" />
      
    </g>
    <!-- Signature Line -->
    <line x1="0" y1="46" x2="320" y2="46" stroke="#D0D0D0" stroke-width="0.75" />
    <!-- Instructor text -->
    <g transform="translate(0, 62)">
      <text x="0" y="0" class="sans-reg" font-size="10.5" fill="#555555">Andrew Ng</text>
      <text x="0" y="14" class="sans-reg" font-size="10.5" fill="#555555">Founder, DeepLearning.AI and Adjunct Professor, Stanford</text>
      <text x="0" y="28" class="sans-reg" font-size="10.5" fill="#555555">University</text>
    </g>
  </g>

  <!-- ================= BOTTOM LEGAL FOOTER ================= -->
  <g transform="translate(600, 778)">
    <line x1="-500" y1="-14" x2="500" y2="-14" stroke="#ECECEC" stroke-width="1" />
    <text x="0" y="0" text-anchor="middle" class="sans-reg" font-size="8.5" fill="#888888">
      This certificate attests to the learner's completion of an online course / project delivered via Coursera. It does not constitute formal enrollment at any university or entity and does not itself grant academic credit, grades, or
    </text>
    <text x="0" y="14" text-anchor="middle" class="sans-reg" font-size="8.5" fill="#888888">
      a degree. Institutions or organizations may, at their discretion, recognize this learning toward their own programs or credentials.
    </text>
  </g>
</svg>